```yaml
name: Validate SRT

on:
  push:
    paths:
      - srt.yaml
  pull_request:
    paths:
      - srt.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate SRT
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          class ValidationError < StandardError; end

          def reject_duplicate_keys!(node)
            case node
            when Psych::Nodes::Mapping
              seen = {}

              node.children.each_slice(2) do |key, value|
                unless key.is_a?(Psych::Nodes::Scalar)
                  raise ValidationError, "mapping keys must be scalars"
                end

                if seen.key?(key.value)
                  raise ValidationError, "duplicate key: #{key.value}"
                end

                seen[key.value] = true
                reject_duplicate_keys!(value)
              end

            when Psych::Nodes::Stream,
                 Psych::Nodes::Document,
                 Psych::Nodes::Sequence
              node.children.each { |child| reject_duplicate_keys!(child) }
            end
          end

          expected = {
            "SRT" => 1,
            "LAW" => {
              "PASS" => "CONTINUE",
              "ELSE" => "FAIL"
            },
            "FAIL" => {
              "REPORT" => "HUMAN",
              "STOP" => true
            }
          }

          begin
            yaml = File.read("srt.yaml")

            ast = Psych.parse_stream(
              yaml,
              filename: "srt.yaml"
            )

            unless ast.children.length == 1
              raise ValidationError,
                    "exactly one YAML document is required"
            end

            reject_duplicate_keys!(ast)

            actual = YAML.safe_load(
              yaml,
              permitted_classes: [],
              permitted_symbols: [],
              aliases: false,
              filename: "srt.yaml"
            )

            unless actual == expected
              raise ValidationError,
                    "schema or values do not exactly match the required SRT contract"
            end

            puts "PASS"

          rescue ValidationError,
                 Psych::Exception,
                 Errno::ENOENT => e
            warn "FAIL: #{e.message}"
            exit 1
          end
          RUBY
```
